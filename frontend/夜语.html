<body>

<div class="night-sky"></div>
<div class="cursor-halo" id="cursor-halo"></div>
<div class="paper-noise"></div>

<div id="root"></div>

<script>
  // 鼠标月晕跟随
  (function(){
    const halo = document.getElementById('cursor-halo');
    let tx = window.innerWidth/2, ty = window.innerHeight/2;
    let cx = tx, cy = ty;
    window.addEventListener('pointermove', (e) => { tx = e.clientX; ty = e.clientY; });
    function tick(){
      cx += (tx - cx) * 0.08;
      cy += (ty - cy) * 0.08;
      halo.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
      requestAnimationFrame(tick);
    }
    tick();
  })();
</script>

<script src="data.js"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>
<script type="text/babel" src="features.jsx"></script>

</body>
</html>
